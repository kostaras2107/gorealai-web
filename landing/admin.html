<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GorealAI Admin</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap');
  :root { --bg:#0a0a0a;--surface:#111111;--surface2:#1a1a1a;--border:#222;--gold:#c9a84c;--gold2:#e8c96a;--text:#f0ece4;--muted:#666;--green:#2ecc71;--red:#e74c3c; }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;}
  #login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#1a1500 0%,#0a0a0a 70%);}
  .login-box{background:var(--surface);border:1px solid #2a2200;border-radius:16px;padding:48px;width:100%;max-width:380px;text-align:center;}
  .login-logo{font-family:'Syne',sans-serif;font-size:28px;font-weight:800;background:linear-gradient(135deg,var(--gold),var(--gold2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px;}
  .login-sub{color:var(--muted);font-size:13px;margin-bottom:36px;letter-spacing:.1em;text-transform:uppercase;}
  .login-box input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:14px 18px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;margin-bottom:16px;outline:none;}
  .login-box input:focus{border-color:var(--gold);}
  .btn-gold{width:100%;background:linear-gradient(135deg,var(--gold),var(--gold2));border:none;border-radius:10px;padding:14px;color:#0a0a0a;font-family:'Syne',sans-serif;font-weight:700;font-size:15px;cursor:pointer;}
  .btn-gold:hover{opacity:.9;}
  .login-error{color:var(--red);font-size:13px;margin-top:12px;display:none;}
  #app{display:none;}
  .header{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 32px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
  .header-logo{font-family:'Syne',sans-serif;font-weight:800;font-size:20px;background:linear-gradient(135deg,var(--gold),var(--gold2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
  .header-badge{background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:6px 14px;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px;}
  .badge-dot{width:6px;height:6px;background:var(--green);border-radius:50%;animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .logout-btn{background:transparent;border:1px solid var(--border);border-radius:8px;padding:8px 16px;color:var(--muted);font-size:13px;cursor:pointer;}
  .logout-btn:hover{border-color:var(--red);color:var(--red);}
  .container{max-width:1200px;margin:0 auto;padding:32px 24px;}
  .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:40px;}
  .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;}
  .stat-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px;}
  .stat-value{font-family:'Syne',sans-serif;font-size:28px;font-weight:700;color:var(--gold);}
  .section-title{font-family:'Syne',sans-serif;font-size:18px;font-weight:700;margin-bottom:20px;display:flex;align-items:center;gap:10px;}
  .section-title::after{content:'';flex:1;height:1px;background:var(--border);}
  .form-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:28px;margin-bottom:40px;}
  .form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:20px;}
  .form-group label{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px;}
  .form-group input,.form-group select{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;outline:none;appearance:none;}
  .form-group input:focus,.form-group select:focus{border-color:var(--gold);}
  .form-group select option{background:#1a1a1a;}
  .form-actions{display:flex;gap:12px;align-items:center;}
  .btn-submit{background:linear-gradient(135deg,var(--gold),var(--gold2));border:none;border-radius:10px;padding:12px 28px;color:#0a0a0a;font-family:'Syne',sans-serif;font-weight:700;font-size:14px;cursor:pointer;}
  .btn-submit:hover{opacity:.85;}
  .form-msg{font-size:13px;padding:8px 14px;border-radius:8px;display:none;}
  .form-msg.success{background:#0d2b1a;color:var(--green);display:block;}
  .form-msg.error{background:#2b0d0d;color:var(--red);display:block;}
  .filter-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px;}
  .filter-row select,.filter-row input{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 14px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px;outline:none;}
  .table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;}
  table{width:100%;border-collapse:collapse;}
  thead th{background:var(--surface2);padding:14px 16px;text-align:left;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:500;border-bottom:1px solid var(--border);}
  tbody tr{border-bottom:1px solid #1a1a1a;transition:background .15s;}
  tbody tr:last-child{border-bottom:none;}
  tbody tr:hover{background:#151515;}
  tbody td{padding:14px 16px;font-size:14px;vertical-align:middle;}
  .pro-name{font-weight:500;}
  .pro-specialty{display:inline-block;background:#1a1200;border:1px solid #2a2000;color:var(--gold);border-radius:6px;padding:3px 10px;font-size:12px;}
  .pro-area{color:var(--muted);font-size:13px;}
  .clicks-badge{font-family:'Syne',sans-serif;font-weight:700;color:var(--gold2);}
  .status-active{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--green);}
  .status-inactive{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);}
  .status-dot{width:6px;height:6px;border-radius:50%;background:currentColor;}
  .action-btns{display:flex;gap:6px;flex-wrap:wrap;}
  .btn-sm{border:none;border-radius:6px;padding:6px 10px;font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:500;}
  .btn-toggle{background:#1a1a1a;color:var(--muted);border:1px solid var(--border);}
  .btn-toggle:hover{color:var(--text);}
  .btn-edit{background:#1a1200;color:var(--gold);border:1px solid #2a2000;}
  .btn-edit:hover{opacity:.8;}
  .btn-delete{background:#2b0d0d;color:var(--red);}
  .btn-delete:hover{opacity:.8;}
  .empty-state{text-align:center;padding:60px 20px;color:var(--muted);}
  .empty-icon{font-size:40px;margin-bottom:12px;}
  .loading{text-align:center;padding:40px;color:var(--muted);font-size:14px;}
  /* MODAL */
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:1000;align-items:center;justify-content:center;}
  .modal-overlay.open{display:flex;}
  .modal{background:var(--surface);border:1px solid #2a2200;border-radius:20px;padding:32px;width:100%;max-width:580px;max-height:90vh;overflow-y:auto;}
  .modal-title{font-family:'Syne',sans-serif;font-size:18px;font-weight:700;color:var(--gold);margin-bottom:24px;}
  .modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px;}
  .modal-actions{display:flex;gap:12px;justify-content:flex-end;}
  .btn-cancel{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:10px 20px;color:var(--muted);font-size:14px;cursor:pointer;}
  .btn-save{background:linear-gradient(135deg,var(--gold),var(--gold2));border:none;border-radius:8px;padding:10px 24px;color:#0a0a0a;font-family:'Syne',sans-serif;font-weight:700;font-size:14px;cursor:pointer;}
  @media(max-width:768px){.header{padding:14px 16px;}.container{padding:20px 16px;}.form-grid,.modal-grid{grid-template-columns:1fr;}table{font-size:13px;}thead th,tbody td{padding:10px 12px;}}
</style>
</head>
<body>

            <option>Αθήνα Κέντρο</option><option>Κολωνάκι</option><option>Εξάρχεια</option><option>Παγκράτι</option><option>Πετράλωνα</option><option>Κουκάκι</option><option>Νέος Κόσμος</option><option>Γλυφάδα</option><option>Βούλα</option><option>Βουλιαγμένη</option><option>Καλλιθέα</option><option>Μοσχάτο</option><option>Ταύρος</option><option>Νέα Σμύρνη</option><option>Παλαιό Φάληρο</option><option>Άλιμος</option><option>Αργυρούπολη</option><option>Ελληνικό</option><option>Χαλάνδρι</option><option>Μαρούσι</option><option>Κηφισιά</option><option>Βριλήσσια</option><option>Νέα Ιωνία</option><option>Ηράκλειο Αττικής</option><option>Μεταμόρφωση</option><option>Αγία Παρασκευή</option><option>Παπάγου</option><option>Χολαργός</option><option>Ζωγράφου</option><option>Βύρωνας</option><option>Καισαριανή</option><option>Ηλιούπολη</option><option>Άγιος Δημήτριος</option><option>Δάφνη</option><option>Υμηττός</option><option>Περιστέρι</option><option>Αιγάλεω</option><option>Χαϊδάρι</option><option>Πετρούπολη</option><option>Ίλιον</option><option>Αγία Βαρβάρα</option><option>Κορυδαλλός</option><option>Νίκαια</option><option>Κερατσίνι</option><option>Δραπετσώνα</option><option>Πειραιάς</option><option>Πέραμα</option><option>Σαλαμίνα</option><option>Αχαρνές</option><option>Κρυονέρι</option><option>Διόνυσος</option><option>Ωρωπός</option><option>Μαραθώνας</option><option>Ραφήνα</option><option>Αρτέμιδα</option><option>Μαρκόπουλο</option><option>Κορωπί</option><option>Παιανία</option><option>Κρόπια</option><option>Παλλήνη</option><option>Γέρακας</option><option>Ανθούσα</option><option>Θεσσαλονίκη Κέντρο</option><option>Καλαμαριά</option><option>Πυλαία</option><option>Σταυρούπολη</option><option>Αμπελόκηποι Θεσσαλονίκης</option><option>Ευόσμος</option><option>Κορδελιό</option><option>Νεάπολη Θεσσαλονίκης</option><option>Συκιές</option><option>Πολίχνη</option><option>Τριανδρία</option><option>Νέα Μηχανιώνα</option><option>Θέρμη</option><option>Πάτρα</option><option>Αίγιο</option><option>Ηράκλειο Κρήτης</option><option>Χανιά</option><option>Ρέθυμνο</option><option>Άγιος Νικόλαος</option><option>Λάρισα</option><option>Βόλος</option><option>Τρίκαλα</option><option>Καρδίτσα</option><option>Ιωάννινα</option><option>Άρτα</option><option>Πρέβεζα</option><option>Λευκάδα</option><option>Κέρκυρα</option><option>Καβάλα</option><option>Δράμα</option><option>Σέρρες</option><option>Κιλκίς</option><option>Αλεξανδρούπολη</option><option>Κομοτηνή</option><option>Ξάνθη</option><option>Ρόδος</option><option>Κως</option><option>Μυτιλήνη</option><option>Χίος</option><option>Σάμος</option>
          </select>
        </div>
        <div class="form-group"><label>Τηλέφωνο *</label><input type="tel" id="f-phone" placeholder="69XXXXXXXX"></div>
        <div class="form-group"><label>URL Φωτογραφίας</label><input type="url" id="f-photo" placeholder="https://..."></div>
        <div class="form-group"><label>Email</label><input type="email" id="f-email" placeholder="email@..."></div>
      </div>
      <div class="form-actions">
        <button class="btn-submit" onclick="addProfessional()">+ Προσθήκη</button>
        <div class="form-msg" id="form-msg"></div>
      </div>
    </div>

    <div class="section-title" style="margin-bottom:16px">Επαγγελματίες</div>
    <div class="filter-row">
      <select id="filter-specialty" onchange="filterTable()"><option value="">Όλες οι ειδικότητες</option></select>
      <select id="filter-area" onchange="filterTable()"><option value="">Όλες οι περιοχές</option></select>
      <input type="text" id="filter-search" placeholder="Αναζήτηση ονόματος..." oninput="filterTable()" style="min-width:180px">
    </div>
    <div class="table-wrap">
      <div class="loading" id="loading">Φόρτωση...</div>
      <table id="pros-table" style="display:none">
        <thead><tr><th>Όνομα</th><th>Ειδικότητα</th><th>Περιοχή</th><th>Τηλέφωνο</th><th>Κλικ</th><th>Κατάσταση</th><th>Ενέργειες</th></tr></thead>
        <tbody id="pros-tbody"></tbody>
      </table>
      <div class="empty-state" id="empty-state" style="display:none"><div class="empty-icon">👤</div><div>Δεν βρέθηκαν επαγγελματίες</div></div>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey:"AIzaSyDjRV1CA5FD144UTyIAc_U5oYbSpzw2aFM",
    authDomain:"shoppilot-app-e4104.firebaseapp.com",
    projectId:"shoppilot-app-e4104",
    storageBucket:"shoppilot-app-e4104.firebasestorage.app",
    messagingSenderId:"451660365555",
    appId:"1:451660365555:web:c340e9650c38bb37888186"
  };
  const ADMIN_PASSWORD = "Kosbos2107";
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  let allPros = [];

  window.doLogin = function() {
    if (document.getElementById('pwd-input').value === ADMIN_PASSWORD) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      loadProfessionals();
    } else { document.getElementById('login-error').style.display = 'block'; }
  };

  window.doLogout = function() {
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
    document.getElementById('pwd-input').value = '';
  };

  window.addProfessional = async function() {
    const name = document.getElementById('f-name').value.trim();
    const specialty = document.getElementById('f-specialty').value;
    const area = document.getElementById('f-area').value;
    const phone = document.getElementById('f-phone').value.trim();
    const photo = document.getElementById('f-photo').value.trim();
    const email = document.getElementById('f-email').value.trim();
    const msg = document.getElementById('form-msg');
    if (!name||!specialty||!area||!phone) { msg.className='form-msg error'; msg.textContent='Συμπλήρωσε τα υποχρεωτικά πεδία'; return; }
    try {
      await addDoc(collection(db,'professionals'),{
        name,specialty,area,phone,photo_url:photo||'',email:email||'',
        is_active:true,total_clicks:0,clicks_this_month:0,total_views:0,
        created_at:serverTimestamp(),createdAt:serverTimestamp()
      });
      msg.className='form-msg success'; msg.textContent='✅ Προστέθηκε!';
      ['f-name','f-phone','f-photo','f-email'].forEach(id=>document.getElementById(id).value='');
      document.getElementById('f-specialty').value=''; document.getElementById('f-area').value='';
      setTimeout(()=>msg.style.display='none',3000); loadProfessionals();
    } catch(e) { msg.className='form-msg error'; msg.textContent='Σφάλμα: '+e.message; }
  };

  async function loadProfessionals() {
    document.getElementById('loading').style.display='block';
    document.getElementById('pros-table').style.display='none';
    document.getElementById('empty-state').style.display='none';
    try {
      // 🔥 Χωρίς orderBy — φαίνονται ΟΛΑ τα records (παλιά + νέα)
      const snap = await getDocs(collection(db,'professionals'));
      allPros = snap.docs.map(d=>({id:d.id,...d.data()}));
      // 🔥 Sort client-side — δουλεύει και με created_at και με createdAt
      allPros.sort((a,b)=>{
        const ta = (a.created_at?.seconds||a.createdAt?.seconds||0);
        const tb = (b.created_at?.seconds||b.createdAt?.seconds||0);
        return tb-ta;
      });
      updateStats(); updateFilters(); renderTable(allPros);
    } catch(e) { console.error(e); }
    document.getElementById('loading').style.display='none';
  }

  function updateStats() {
    const active=allPros.filter(p=>p.is_active).length;
    const clicks=allPros.reduce((s,p)=>s+(p.clicks_this_month||0),0);
    const specs=[...new Set(allPros.map(p=>p.specialty).filter(Boolean))].length;
    document.getElementById('stat-total').textContent=allPros.length;
    document.getElementById('stat-active').textContent=active;
    document.getElementById('stat-clicks').textContent=clicks;
    document.getElementById('stat-specs').textContent=specs;
    document.getElementById('total-count').textContent=allPros.length+' επαγγελματίες';
  }

  function updateFilters() {
    const specs=[...new Set(allPros.map(p=>p.specialty).filter(Boolean))].sort();
    const areas=[...new Set(allPros.map(p=>p.area).filter(Boolean))].sort();
    document.getElementById('filter-specialty').innerHTML='<option value="">Όλες οι ειδικότητες</option>'+specs.map(s=>`<option>${s}</option>`).join('');
    document.getElementById('filter-area').innerHTML='<option value="">Όλες οι περιοχές</option>'+areas.map(a=>`<option>${a}</option>`).join('');
  }

  window.filterTable = function() {
    const spec=document.getElementById('filter-specialty').value;
    const area=document.getElementById('filter-area').value;
    const search=document.getElementById('filter-search').value.toLowerCase();
    renderTable(allPros.filter(p=>(!spec||p.specialty===spec)&&(!area||p.area===area)&&(!search||(p.name||'').toLowerCase().includes(search))));
  };

  function renderTable(pros) {
    if (pros.length===0) { document.getElementById('pros-table').style.display='none'; document.getElementById('empty-state').style.display='block'; return; }
    document.getElementById('pros-table').style.display='table';
    document.getElementById('empty-state').style.display='none';
    document.getElementById('pros-tbody').innerHTML=pros.map(p=>`
      <tr>
        <td class="pro-name">${p.name||'-'}</td>
        <td><span class="pro-specialty">${p.specialty||'-'}</span></td>
        <td class="pro-area">${p.area||'-'}</td>
        <td style="font-size:13px;color:#999">${p.phone||'-'}</td>
        <td><span class="clicks-badge">${p.total_clicks||0}</span></td>
        <td>${p.is_active?'<span class="status-active"><span class="status-dot"></span>Ενεργός</span>':'<span class="status-inactive"><span class="status-dot"></span>Ανενεργός</span>'}</td>
        <td>
          <div class="action-btns">
            <button class="btn-sm btn-edit" onclick="openEdit('${p.id}')">✏️ Επεξ.</button>
            <button class="btn-sm btn-toggle" onclick="toggleActive('${p.id}',${p.is_active})">${p.is_active?'Απενεργ.':'Ενεργ.'}</button>
            <button class="btn-sm btn-delete" onclick="deletePro('${p.id}','${(p.name||'').replace(/'/g,"\\'")}')">Διαγραφή</button>
          </div>
        </td>
      </tr>
    `).join('');
  }

  window.openEdit = function(id) {
    const p=allPros.find(x=>x.id===id); if(!p) return;
    document.getElementById('edit-id').value=id;
    document.getElementById('edit-name').value=p.name||'';
    document.getElementById('edit-phone').value=p.phone||'';
    document.getElementById('edit-email').value=p.email||'';
    document.getElementById('edit-specialty').value=p.specialty||'';
    document.getElementById('edit-area').value=p.area||'';
    document.getElementById('edit-photo').value=p.photo_url||'';
    document.getElementById('edit-msg').style.display='none';
    document.getElementById('edit-modal').classList.add('open');
  };

  window.closeEdit = function() { document.getElementById('edit-modal').classList.remove('open'); };

  document.getElementById('edit-modal').addEventListener('click',function(e){ if(e.target===this) closeEdit(); });

  window.saveEdit = async function() {
    const id=document.getElementById('edit-id').value;
    const name=document.getElementById('edit-name').value.trim();
    const phone=document.getElementById('edit-phone').value.trim();
    const email=document.getElementById('edit-email').value.trim();
    const specialty=document.getElementById('edit-specialty').value;
    const area=document.getElementById('edit-area').value;
    const photo=document.getElementById('edit-photo').value.trim();
    const msg=document.getElementById('edit-msg');
    if(!name||!phone||!specialty||!area){msg.className='form-msg error';msg.textContent='Συμπλήρωσε τα υποχρεωτικά πεδία';return;}
    try {
      await updateDoc(doc(db,'professionals',id),{name,phone,email,specialty,area,photo_url:photo});
      msg.className='form-msg success'; msg.textContent='✅ Αποθηκεύτηκε!';
      setTimeout(()=>{closeEdit();loadProfessionals();},1000);
    } catch(e){msg.className='form-msg error';msg.textContent='Σφάλμα: '+e.message;}
  };

  window.toggleActive = async function(id,current) {
    await updateDoc(doc(db,'professionals',id),{is_active:!current}); loadProfessionals();
  };

  window.deletePro = async function(id,name) {
    if(!confirm(`Διαγραφή του "${name}";`)) return;
    await deleteDoc(doc(db,'professionals',id)); loadProfessionals();
  };
</script>
</body>
</html>
