  <meta property="og:description" content="Βρες τον κατάλληλο επαγγελματία κοντά σου με ένα αίτημα. Κατέβασέ το τώρα δωρεάν για Android και iPhone.">

  <meta name="twitter:image" content="https://gorealai.web.app/app/icons/Icon-512.png">

  <script>
    // iPhone/iPad → App Store, όλα τα άλλα → Google Play. Μικρή καθυστέρηση
    // ώστε να προλάβει να "χτυπήσει" το Google tag πριν φύγουμε από τη σελίδα —
    // αλλιώς το conversion tracking της διαφήμισης χάνεται σε άμεσο redirect.
    var ua = navigator.userAgent || "";
    var isIOS = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    var STORE = isIOS ? "https://apps.apple.com/gr/app/gorealpro/id6817919309" : "https://play.google.com/store/apps/details?id=gr.gorealai.app";
    setTimeout(function() { window.location.replace(STORE); }, 400);
    document.addEventListener("DOMContentLoaded", function() {
      document.getElementById("store-name").textContent = isIOS ? "App Store" : "Google Play";
      document.getElementById("store-link").href = STORE;
    });
  </script>

  <style>
    body { font-family: Arial, sans-serif; background:#0A0800; color:#fff; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; text-align:center; }
    a { display:inline-block; margin-top:20px; padding:14px 32px; background:#E8C66A; color:#000; border-radius:12px; text-decoration:none; font-weight:800; }
  </style>
</head>
<body>
  <div>
    <h1 style="color:#FFD47A">Μεταφορά στο <span id="store-name">Google Play</span>...</h1>
    <a id="store-link" href="https://play.google.com/store/apps/details?id=gr.gorealai.app">Πάτα εδώ αν δεν μεταφέρθηκες αυτόματα</a>
  </div>
</body>
