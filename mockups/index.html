  iframe { border: none; border-radius: 40px; box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 0 8px #1a1a1a, 0 0 0 10px #333; }
  .label { color: rgba(255,255,255,0.6); font-size: 12px; }

<body>
  <div class="mockup-wrap">
    <h2>Design 1 — "Dashboard Pro"</h2>
    <p class="subtitle">Hero profile card με stats + quick actions + tabbed content. Εστίαση στο profile του επαγγελματία.</p>
    <iframe src="pro_home_v1.html" width="390" height="844" scrolling="no"></iframe>
  </div>
  <div class="mockup-wrap">
    <h2>Design 2 — "Command Center"</h2>
    <p class="subtitle">Greeting + glance metrics με revenue goal + availability toggle + action list με priority labels.</p>
    <iframe src="pro_home_v2.html" width="390" height="844" scrolling="no"></iframe>
