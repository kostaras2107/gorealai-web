name: shoppilot
description: "GorealAI Bidding App"
publish_to: 'none'
version: 2.0.1+2

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase — συμβατές versions
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3

  # UI & Utils
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.2
  local_auth: ^2.3.0
  url_launcher: ^6.3.1
  http: ^1.2.2
  firebase_storage: ^12.1.0
  firebase_analytics: ^11.4.0
  image_picker: ^1.1.2
  speech_to_text: ^7.0.0
  record: ^5.1.2
  audioplayers: ^6.1.0
  shimmer: ^3.0.0
  permission_handler: ^11.3.1
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  cupertino_icons: ^1.0.8

  # Αυτά δεν χρησιμοποιούνται πλέον — μπορείς να τα αφαιρέσεις
  # flutter_markdown: ^0.7.3
  # share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Cormorant
      fonts:
        - asset: fonts/CormorantGaramond-VariableFont_wght.ttf
          weight: 400
        - asset: fonts/CormorantGaramond-Italic-VariableFont_wght.ttf
          weight: 400
          style: italic
    - family: Raleway
      fonts:
        - asset: fonts/Raleway-VariableFont_wght.ttf
        - asset: fonts/Raleway-Italic-VariableFont_wght.ttf
          style: italic
  assets:
    - assets/images/background.png
    - assets/images/background_chat.png
    - assets/images/gorilla_head.png
    - assets/images/gorilla_left.png
    - assets/images/gorilla_right.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/gorealai.png"